services:
  postgres:
    image: postgres:16-alpine
    container_name: detectgrowth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: detectgrowth
      POSTGRES_USER: detectgrowth
      POSTGRES_PASSWORD: detectgrowth_local
    ports:
      - "5432:5432"
    volumes:
      - detectgrowth-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: detectgrowth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - detectgrowth-redis-data:/data

volumes:
  detectgrowth-postgres-data:
  detectgrowth-redis-data:
